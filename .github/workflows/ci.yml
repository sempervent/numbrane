name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engines/web/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Install fast validation dependencies
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install ryl
          uv tool install check-jsonschema
          uv sync --directory engines/python --frozen --extra dev
          npm ci --prefix engines/web

      - name: Fast PR validation
        run: just pr-fast

  main-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pr-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engines/web/package-lock.json
      - run: |
          uv sync --directory engines/python --frozen --extra dev
          npm ci --prefix engines/web
      - name: Selected renderer smoke
        run: just smoke
