# Docker Compose runs images produced by `docker buildx bake`.
# Do not define competing Dockerfile build graphs here.

services:
  renderer:
    image: numbrane-render:local
    volumes:
      - ./artifacts:/artifacts
      - ./pieces:/src/pieces:ro
    environment:
      NUMBRANE_ROOT: /src
      ARTIFACTS_DIR: /artifacts
    # No microphone devices — browser owns getUserMedia.

  studio:
    image: numbrane-studio:local
    ports:
      - "8080:8080"
    depends_on:
      - renderer
    volumes:
      - ./artifacts:/artifacts
    # Mic stays in the browser (getUserMedia). Container only serves Studio + proxies /api.

  docs:
    image: numbrane-docs:local
    profiles: ["docs"]
    ports:
      - "8081:8080"

  python:
    image: numbrane-python:local
    profiles: ["python"]
    volumes:
      - ./artifacts:/src/artifacts
      - ./pieces:/src/pieces:ro
    working_dir: /src/engines/python
