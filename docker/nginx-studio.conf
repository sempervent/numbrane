server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index studio.html index.html;

  # Proxy Studio API to render service (Compose DNS name `renderer`).
  location /api/ {
    proxy_pass http://renderer:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 32m;
  }

  location /health {
    proxy_pass http://renderer:8090/health;
  }

  location / {
    try_files $uri $uri/ /studio.html;
  }

  location /shaders/ {
    add_header Cache-Control "public, max-age=3600";
  }
}
