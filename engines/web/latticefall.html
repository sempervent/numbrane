<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LATTICEFALL — NUMBRANE</title>
    <style>
      :root {
        --bg: #050608;
        --hud: #0a0c10;
        --hud-border: #171a22;
        --ink: #e8f0ff;
        --neon: #7ad7ff;
      }
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        color: var(--ink);
      }
      #app {
        display: grid;
        grid-template-columns: minmax(220px, 280px) 1fr;
      }
      #hud {
        background: var(--hud);
        border-right: 1px solid var(--hud-border);
        padding: 1rem;
        overflow: auto;
        z-index: 2;
      }
      #canvas {
        position: relative;
        min-height: 100%;
      }
      @media (max-width: 720px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        #hud {
          max-height: 40vh;
          border-right: none;
          border-bottom: 1px solid var(--hud-border);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
      <div id="canvas"></div>
    </div>
    <script type="module" src="/src/latticefall/main.ts"></script>
  </body>
</html>
