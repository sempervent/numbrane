<!doctype html>
<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>NUMBRANE web — audiovisual nodes</title>
    <style>
      :root {
        --bg: #050607;
        --hud: #0a0c10;
        --hud-border: #171a22;
