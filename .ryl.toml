# NUMBRANE ryl configuration — explicit rules (ryl has no default-on rules).

ignore = [
  "site/**",
  "engines/**/node_modules/**",
  "engines/**/.venv/**",
  "engines/rust/target/**",
  "**/.pytest_cache/**",
]

[files]
yaml = ["*.yaml", "*.yml"]

[rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
document-end = "disable"
document-start = "disable"
empty-lines = "enable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
key-ordering = "disable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
quoted-strings = "disable"
trailing-spaces = "enable"

[rules.comments]
level = "warning"

[rules.comments-indentation]
level = "warning"

[rules.line-length]
max = 120
allow-non-breakable-words = true
allow-non-breakable-inline-mappings = true

[rules.truthy]
level = "warning"
allowed-values = ["true", "false", "on", "off"]

[per-file-ignores]
".github/**" = ["truthy", "line-length"]
".pre-commit-config.yaml" = ["line-length"]
